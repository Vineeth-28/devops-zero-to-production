# Example: Secrets
# Never hardcode credentials. Reference them via ${{ secrets.NAME }}.
# Secrets are configured in: Repo Settings -> Secrets and variables -> Actions.

name: Secrets Example

on: push

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use a secret safely
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "API_TOKEN is not set"
            exit 1
          fi
          echo "Token loaded (value not printed)"

      - name: Log in to a registry using secrets
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
