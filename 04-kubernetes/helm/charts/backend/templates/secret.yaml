# NOTE: For real deployments, do NOT store secret values in values.yaml
# or Git. Use a secrets manager (e.g. AWS Secrets Manager, Vault,
# Sealed Secrets, External Secrets Operator) to inject these at deploy
# time. This template demonstrates chart structure only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-secret
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
